# Full stack: MongoDB + backend API + Next.js frontend
#   cp .env.example .env   (fill in your keys)
#   docker compose up --build
services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Uses the bundled MongoDB container. Delete this line to use MONGODB_URI from .env (e.g. Atlas).
      MONGODB_URI: mongodb://mongodb:27017/ai-workflow-automation
    ports:
      - '5000:5000'
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:5000
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  mongo_data:
